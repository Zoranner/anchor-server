[workspace]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
anchor-core = { path = "../crates/anchor-core" }
anchor-protocol = { path = "../crates/anchor-protocol" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "anchor-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anchor Guard 服务端 API"

[dependencies]
aes-gcm = "0.10"
anchor-core.workspace = true
anchor-protocol.workspace = true
anyhow.workspace = true
argon2 = "0.5"
axum = "0.8"
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hkdf = "0.12"
rand.workspace = true
sea-orm = { version = "2.0.2", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-query = "1.0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
